[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "herdr-agent-workspace"
version = "0.1.0"
description = "Herdr-first multi-agent command plane with scoped graph memory"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
herdctl = "herdctl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
